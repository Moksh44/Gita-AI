    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbfaf7">
    <script>
        (() => {
            try {
                const raw = localStorage.getItem('gita.sanctuary.v1');
                const saved = raw ? JSON.parse(raw) : null;
                const pref = saved?.settings?.theme;
                const isDark = pref === 'dark' || (pref !== 'light' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                const meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', isDark ? '#121212' : '#fbfaf7');
            } catch (_) {}
        })();
    </script>

        content="A little ancient wisdom for your everyday. Your private space for Bhagavad Gita conversations, reflection, and discovery.">
